services:
  # ==========================================
  # FastAPI Python Backend Service
  # ==========================================
  - type: web
    name: cardiovista-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: MODEL_ARTIFACTS_DIR
        value: "backend/model_artifacts"
      - key: DATABASE_PATH
        value: "backend/data/cardiovista.db"

  # ==========================================
  # Vite React Frontend Static Site
  # ==========================================
  - type: web
    name: cardiovista-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cardiovista-api
          property: host